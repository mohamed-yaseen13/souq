# Minimal memory settings (if 2GB still causes issues)
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true
android.enableJetifier=true

# Performance settings
org.gradle.daemon=true
org.gradle.parallel=true
